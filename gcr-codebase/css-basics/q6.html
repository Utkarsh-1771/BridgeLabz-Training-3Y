<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================
   BASIC RESET
========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
   BODY
========================= */

        body {
            font-family: Arial, sans-serif;

            background-color: #f2f5f9;

            padding: 40px;
        }


        /* =========================
   HEADING
========================= */

        h1 {
            text-align: center;

            margin-bottom: 40px;

            color: #1d3557;

            font-size: 2.5rem;
        }


        /* =========================
   GALLERY
========================= */

        .gallery {

            /* CSS Grid */
            display: grid;

            /* 3 columns */
            grid-template-columns: repeat(3, 1fr);

            gap: 25px;

            max-width: 1200px;

            margin: auto;
        }


        /* =========================
   PHOTO CONTAINER
========================= */

        .photo {

            position: relative;

            overflow: hidden;

            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            background-color: white;
        }


        /* =========================
   IMAGE
========================= */

        .photo img {

            width: 100%;

            height: 250px;

            display: block;

            object-fit: cover;

            border-radius: 12px;

            /* Smooth scaling */
            transition: transform 0.4s ease;
        }


        /* =========================
   CAPTION
========================= */

        .caption {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            padding: 15px;

            background-color: rgba(0, 0, 0, 0.7);

            color: white;

            text-align: center;

            font-size: 1.1rem;

            /* Initially hidden */
            opacity: 0;

            transition: opacity 0.4s ease;
        }


        /* =========================
   HOVER EFFECT
========================= */

        /* Image becomes slightly larger */
        .photo:hover img {
            transform: scale(1.1);
        }


        /* Caption becomes visible */
        .photo:hover .caption {
            opacity: 1;
        }


        /* =========================
   RESPONSIVE DESIGN
========================= */

        /* Tablet */
        @media (max-width: 900px) {

            .gallery {

                /* 2 columns */
                grid-template-columns: repeat(2, 1fr);
            }
        }


        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .gallery {

                /* 1 column */
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <!-- Image 1 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain">

            <div class="caption">
                Beautiful Mountains
            </div>
        </div>


        <!-- Image 2 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">

            <div class="caption">
                Peaceful Beach
            </div>
        </div>


        <!-- Image 3 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Nature">

            <div class="caption">
                Beautiful Nature
            </div>
        </div>


        <!-- Image 4 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">

            <div class="caption">
                Green Forest
            </div>
        </div>


        <!-- Image 5 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" alt="Mountain Landscape">

            <div class="caption">
                Mountain Landscape
            </div>
        </div>


        <!-- Image 6 -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Lake">

            <div class="caption">
                Beautiful Lake
            </div>
        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="q7.css">
</head>

<body>
    <header class="header">
        <h1>User Interface Components</h1>
        <p>A simple collection of common UI elements.</p>
    </header>

    <main>
        <section class="ui-card">
            <h2>Explore Products</h2>
            <p class="description">Use the controls below to search and filter products.</p>

            <div class="search-box">
                <label for="search">Search</label>
                <div class="search-row">
                    <input type="search" id="search" placeholder="Search for a product">
                    <button type="button" class="search-btn">Search</button>
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="">Choose a category</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="sports">Sports</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" class="primary-btn">Apply Filter</button>
                <button type="button" class="secondary-btn">Reset</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>CSS UI Components Practice</p>
    </footer>
</body>

</html>

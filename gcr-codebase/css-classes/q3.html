<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>

<body>
    <header class="header">
        <h1>Image Showcase</h1>
        <p>A collection of images with simple hover effects.</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
                    <div class="overlay"></div>
                </div>
                <figcaption>Friendly Companion</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1035/600/400" alt="River landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Quiet River</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1043/600/400" alt="Beach landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Sunny Beach</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/id/1069/600/400" alt="Natural scenery">
                    <div class="overlay"></div>
                </div>
                <figcaption>Natural Beauty</figcaption>
            </figure>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Image Showcase Practice</p>
    </footer>
</body>

</html>

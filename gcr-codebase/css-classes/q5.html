<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header class="header">
        <h1>Styled Button Collection</h1>
        <p>Different button styles using simple CSS effects.</p>
    </header>

    <main>
        <section class="button-section">
            <h2>Button Styles</h2>

            <div class="button-group">
                <button class="btn primary">Primary</button>
                <button class="btn secondary">Secondary</button>
                <button class="btn outline">Outline</button>
                <button class="btn disabled" disabled>Disabled</button>
            </div>

            <p class="info">Try hovering, clicking, or focusing on the buttons to see their different states.</p>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Button Styling Practice</p>
    </footer>
</body>
</html>

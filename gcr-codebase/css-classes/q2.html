<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>

<body>
    <header class="header">
        <h1>Tooltip Demonstration</h1>
        <p>Hover over each element to view its tooltip.</p>
    </header>

    <main>
        <section class="tooltip-section">
            <div class="tooltip-item">
                <span class="icon">💡</span>
                <span class="tooltip">Helpful Idea</span>
                <p>Idea</p>
            </div>

            <div class="tooltip-item">
                <span class="icon">🔒</span>
                <span class="tooltip">Your data is secure</span>
                <p>Security</p>
            </div>

            <div class="tooltip-item">
                <span class="icon">⭐</span>
                <span class="tooltip">Favorite Item</span>
                <p>Favorite</p>
            </div>

            <div class="tooltip-item">
                <span class="word">Profile</span>
                <span class="tooltip">View your profile</span>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Tooltip Practice</p>
    </footer>
</body>

</html>

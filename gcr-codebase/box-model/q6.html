<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6.css">
</head>

<body>
    <header class="header">
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see a different transformation.</p>
    </header>

    <main>
        <section class="transform-section">
            <div class="transform-item">
                <div class="box rotate-box">Rotate</div>
                <h2>rotate()</h2>
            </div>

            <div class="transform-item">
                <div class="box scale-box">Scale</div>
                <h2>scale()</h2>
            </div>

            <div class="transform-item">
                <div class="box translate-box">Translate</div>
                <h2>translate()</h2>
            </div>

            <div class="transform-item">
                <div class="box skew-box">Skew</div>
                <h2>skew()</h2>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Transformations Practice</p>
    </footer>
</body>

</html>

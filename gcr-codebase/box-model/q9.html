<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling</title>
    <link rel="stylesheet" href="q9.css">
</head>

<body>
    <header class="header">
        <h1>Outline and Focus Styling</h1>
        <p>Explore outlines, focus states, and form styling with CSS.</p>
    </header>

    <main>
        <section class="form-section">
            <form class="contact-form">
                <h2>Contact Form</h2>
                <p class="form-description">Fill in your details below.</p>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter the subject">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message"></textarea>
                </div>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Outline and Focus Practice</p>
    </footer>
</body>

</html>

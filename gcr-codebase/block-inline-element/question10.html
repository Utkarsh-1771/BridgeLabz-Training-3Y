<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Haryana</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Gurugram</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
        <option>Delhi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Manali</option>
        <option>Goa</option>
        <option>Jaipur</option>
        <option>Kerala</option>
    </select>

    <p>
        My selected country is India, my state is Haryana,
        my city is Gurugram, and my favorite tourist place is Manali.
    </p>

</body>
</html>

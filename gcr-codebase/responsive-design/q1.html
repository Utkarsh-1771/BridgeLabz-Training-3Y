<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>

<body>
    <header class="header">
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter effect.</p>
    </header>

    <main>
        <section class="gallery-section">
            <h2>CSS Image Filters</h2>

            <div class="gallery">
                <figure class="gallery-item">
                    <img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
                    <figcaption>Blur Effect</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="grayscale" src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
                    <figcaption>Grayscale Effect</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="sepia" src="https://picsum.photos/id/1025/600/400" alt="Dog outdoors">
                    <figcaption>Sepia Effect</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="brightness" src="https://picsum.photos/id/1035/600/400" alt="River and mountains">
                    <figcaption>Brightness Effect</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="contrast" src="https://picsum.photos/id/1043/600/400" alt="Beach and ocean">
                    <figcaption>Contrast Effect</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="hue" src="https://picsum.photos/id/1069/600/400" alt="Natural landscape">
                    <figcaption>Hue-Rotate Effect</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Responsive CSS Filter Gallery</p>
    </footer>
</body>

</html>
